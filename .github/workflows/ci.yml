# The check that has to stay green: every test passes and both jars still build.
# `./mvnw verify` runs the same thing locally; this is the part that doesn't depend
# on anyone remembering to.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    # Pinned, not -latest, so a new runner image never changes the check unannounced.
    runs-on: ubuntu-24.04
    steps:
      # Each action is pinned to a commit, not a tag: a tag can be moved to other code by
      # whoever controls it, a commit cannot. Dependabot proposes updates. The checkout
      # keeps no token behind, since nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temurin 25, the JDK the POM compiles for (maven.compiler.release 25).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Compiles, runs every test, then packages both jars, so a change that breaks the
      # build fails here as well as one that breaks a test. The runner has no display, and
      # no test needs one: TypingMeasurement, the one that opens a window, is left out by
      # its name, which isn't one Surefire runs. Through the Maven Wrapper, so the Maven is
      # the one anyone building from source gets.
      - name: Test and package
        run: ./mvnw --batch-mode verify
